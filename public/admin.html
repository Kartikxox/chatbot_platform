<!DOCTYPE html>
<html>
<head>
<title>Chatbot Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000435;
    --panel: #FFFFFF;
    --border: #E4E1DA;
    --ink: #1C1C1A;
    --muted: #8A8579;
    --accent: #0F6B5C;
    --accent-soft: #E6F1EE;
    --error: #B3413B;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 48px 24px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 32px 0;
    letter-spacing: -0.01em;
  }
  .field {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  textarea {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    height: 420px;
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .row input { flex: 1; }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s ease;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:active { opacity: 0.7; }
  .btn-primary {
    background: var(--ink);
    color: white;
  }
  .btn-accent {
    background: var(--accent);
    color: white;
    margin-top: 16px;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 18px;
  }
  #status.ok { color: var(--accent); }
  #status.err { color: var(--error); }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Chatbot Platform</div>
  <h1>Flow Editor</h1>

  <div class="field">
    <label>Brand ID</label>
    <div class="row">
      <input type="number" id="brandId" placeholder="e.g. 1" />
      <button class="btn-primary" onclick="loadFlow()">Load</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>Flow JSON</label>
    <textarea id="flowJson" placeholder="Load a brand to see its flow here..." spellcheck="false"></textarea>
  </div>

  <button class="btn-accent" onclick="saveFlow()">Save changes</button>
  <div id="status"></div>
</div>

<script>
  const API_BASE = "https://chatbotplatform-production.up.railway.app";
  const statusEl = document.getElementById('status');

  function setStatus(message, type) {
    statusEl.className = type;
    statusEl.innerHTML = message ? `<span class="dot"></span>${message}` : '';
  }

  async function loadFlow() {
    const brandId = document.getElementById('brandId').value;
    if (!brandId) { setStatus('Enter a brand ID first.', 'err'); return; }
    setStatus('Loading…', '');

    try {
      const res = await fetch(`${API_BASE}/api/flows/${brandId}`);
      const data = await res.json();

      if (res.ok) {
        document.getElementById('flowJson').value = JSON.stringify(data.flow_json, null, 2);
        setStatus('Loaded.', 'ok');
      } else {
        setStatus(data.error || 'Could not load flow.', 'err');
      }
    } catch (err) {
      setStatus('Failed to load: ' + err.message, 'err');
    }
  }

  async function saveFlow() {
    const brandId = document.getElementById('brandId').value;
    if (!brandId) { setStatus('Enter a brand ID first.', 'err'); return; }
    const jsonText = document.getElementById('flowJson').value;

    let parsedJson;
    try {
      parsedJson = JSON.parse(jsonText);
    } catch (err) {
      setStatus('Invalid JSON: ' + err.message, 'err');
      return;
    }

    setStatus('Saving…', '');

    try {
      const res = await fetch(`${API_BASE}/api/flows/${brandId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ flow_json: parsedJson })
      });
      const data = await res.json();

      if (res.ok) {
        setStatus('Saved.', 'ok');
      } else {
        setStatus(data.error || 'Could not save.', 'err');
      }
    } catch (err) {
      setStatus('Failed to save: ' + err.message, 'err');
    }
  }
</script>

</body>
</html>
